<style>
[hidden] { display:none !important; }

:root[data-theme="dark"] { --bg:#141517; --panel:#1f2124; --ink:#ebe9e4; --muted:#a19d95; --line:#33363a; --accent:#6fc3a8; --accent-ink:#0f1d18; --chip:#2a2d31; --good:#8fd694; --bad:#ef8a7e; }

.tools { position:absolute; left:max(10px, env(safe-area-inset-left)); top:calc(max(6px, env(safe-area-inset-top)) + 46px); z-index:6; display:flex; gap:6px; transform:scale(var(--ui)); transform-origin:top left; }

.duo { position:absolute; right:calc(max(14px, env(safe-area-inset-right)) + 140px * var(--ui)); top:max(6px, env(safe-area-inset-top)); z-index:6; display:flex; flex-direction:row; gap:6px; align-items:flex-start; transform:scale(var(--ui)); transform-origin:top right; }
.duo .u { position:relative; width:62px; min-height:0; padding:0; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:#f3f1ec; touch-action:none; }

.duo .u small { position:absolute; left:-4px; top:34px; font:700 10px system-ui; background:#1c2420; border:1px solid #8e958e; border-radius:999px; padding:0 4px; }

.mehp i.hp b { background:linear-gradient(#5fe0a8, #2fa778); transition:width .2s; }

.mehp small { display:block; font:600 10px system-ui; color:#e8e6e0; text-shadow:0 1px 2px #000; margin-top:1px; }
i.hp, i.en { display:block; height:7px; background:#3a423e; border-radius:4px; overflow:hidden; }
i.hp b { display:block; height:100%; background:#6fd07a; } i.en b { display:block; height:100%; background:#6fb4e6; }
.foes { display:none !important; /* 31-10: sin barra de vida del rival (decisión de Sebastian) */ position:absolute; left:50%; transform:translateX(-50%); top:calc(max(6px, env(safe-area-inset-top)) + 52px + 38px * var(--ui)); /* E2-3: bajo la fila Llamar/Bolsa/Movimiento, sin pisarla en pantallas estrechas */ z-index:5; display:flex; gap:6px; pointer-events:none; }

.ctxchip { position:absolute; left:50%; transform:translateX(-50%); top:max(8px, env(safe-area-inset-top)); z-index:5; font:600 12px system-ui; color:#f3f1ec; background:#1c2420; padding:4px 12px; border-radius:999px; pointer-events:none; transition:background .25s; }
.stage[data-ctx="ALERTA"] .ctxchip { background:#7a5a12; }
.stage[data-ctx="COMBATE"] .ctxchip { background:#7a2a20; }
.alert { position:absolute; left:50%; transform:translateX(-50%); top:calc(max(6px, env(safe-area-inset-top)) + 72px); z-index:5; font:12.5px system-ui; color:#fff4d6; background:#3d2f10; border:1px solid #c79a2a; padding:3px 12px; border-radius:999px; pointer-events:none; }

.toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
/* EB0: aviso de área (número y nombre), breve, arriba en el centro bajo la etiqueta de contexto; no recibe toques. */
.areab { position:absolute; left:50%; top:calc(max(8px, env(safe-area-inset-top)) + 30px); transform:translateX(-50%); z-index:6; pointer-events:none; text-align:center; color:#f6f1e4; text-shadow:0 1px 4px rgba(0,0,0,.8); animation:areab 2.6s ease both; white-space:nowrap; }

/* EB0.1: mapa que se descubre. Recuadro arriba a la izquierda, bajo Llamar/Bolsa/Movimiento; toca para verlo entero. */
.map { position:absolute; left:max(10px, env(safe-area-inset-left)); top:calc(max(6px, env(safe-area-inset-top)) + 46px + 44px * var(--ui)); z-index:6; width:calc(96px * var(--ui)); height:calc(96px * var(--ui)); border-radius:10px; overflow:hidden; border:2px solid rgba(232,228,218,.7); box-shadow:0 2px 6px rgba(0,0,0,.4); background:#161a18; touch-action:none; }
.map canvas { position:static; inset:auto; width:100%; height:100%; display:block; }

.mapfull { position:absolute; inset:0; z-index:20; background:rgba(10,12,11,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none; }

.mapfull small { color:#d8d2c4; margin-top:4px; font:12px system-ui; }
.mapfull .tpbtn { margin-top:8px; padding:10px 16px; border-radius:10px; border:1px solid #8a8270; background:#2a2c28; color:#f6f1e4; font:600 14px system-ui; }

.mapfull .mapbtns { position:absolute; top:max(10px, env(safe-area-inset-top)); right:max(10px, env(safe-area-inset-right)); display:flex; flex-direction:column; gap:10px; z-index:2; }
.mapfull .mapbtns button { width:52px; height:52px; border-radius:12px; border:1px solid #8a8270; background:rgba(42,44,40,.92); color:#f6f1e4; font:700 26px system-ui; line-height:1; padding:0; touch-action:none; }
.mapfull .mapbtns #mapX { background:rgba(120,40,30,.92); border-color:#e0a090; margin-bottom:8px; }
@keyframes areab { 0% { opacity:0; transform:translate(-50%, -6px); } 12% { opacity:1; transform:translate(-50%, 0); } 80% { opacity:1; } 100% { opacity:0; } }
.floaters { position:absolute; inset:0; z-index:4; pointer-events:none; }

.fl.me { color:#ff8a7a; } .fl.info { color:#ffe28a; font-size:13px; }
/* Mandos de la derecha (cierre de E2, 27-10): GRUPO COMPACTO para el pulgar derecho, semitransparentes (opacidad del
   fondo --bga, 40–55 %, por defecto 48 %; se elige en la portada) con iconos blancos nítidos y sombra para leerse sobre
   el bosque. El ataque es el grande, en la esquina; esquiva y habilidades en arco a su alrededor; guardia y reanimar en
   un segundo arco; ⇄ apartado arriba, cuadrado y azul, para no pulsarlo sin querer. Cada botón tiene un área táctil
   MAYOR que su círculo visible (--hit). Sitios FIJOS: el contexto solo cambia lo que muestran. */
.pad { position:absolute; right:max(10px, env(safe-area-inset-right)); bottom:max(8px, env(safe-area-inset-bottom)); width:0; height:0; z-index:5; transform:scale(var(--ui)); transform-origin:0 0; }
.slot { --sb:#1d2621; --sbd:#e8e4da; --sz:56px; --hit:calc(var(--sz) + 18px); position:absolute; width:var(--hit); height:var(--hit); margin:calc(var(--hit) / -2) 0 0 calc(var(--hit) / -2); padding:0; border:0; border-radius:50%; background:none; isolation:isolate;
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; color:#fff; touch-action:none; transition:opacity .22s; }
.slot::before, .slot::after { content:""; position:absolute; inset:calc((var(--hit) - var(--sz)) / 2); border-radius:50%; pointer-events:none; }
.slot::before { z-index:-2; background:color-mix(in srgb, var(--sb) calc(var(--bga, .48) * 100%), transparent); border:1.5px solid color-mix(in srgb, var(--sbd) 70%, transparent); box-shadow:0 2px 6px rgba(0,0,0,.22); transition:background-color .15s, border-color .15s, transform .08s; }
.slot::after { z-index:-1; background:conic-gradient(rgba(6,8,7,.62) calc(var(--cd,0)*360deg), transparent 0); }
.slot b { font-size:21px; font-weight:400; text-shadow:0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.45); }
.slot .l { font-size:8px; max-width:52px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; text-shadow:0 1px 2px #000, 0 0 3px #000; }
.slot small { font-size:9px; font-weight:700; color:#ffe28a; min-height:9px; text-shadow:0 1px 2px #000; }
.slot.cd small { font-size:13px; color:#fff; }
.slot.off { --sb:#2a2e2c; --sbd:#8d918c; color:#c3c6c1; }
.slot.off b { opacity:.7; }
.slot.standby { --sb:#222a26; --sbd:#b9beb7; color:#e3e6df; }
.slot.hide { opacity:0; pointer-events:none; }
/* Exploración: el grande es INTERACTUAR (verde) y la secundaria se pone roja cuando hay un rival a tiro. */
.slot.int { --sb:#1f4a2a; --sbd:#d6f2cf; }
.slot.int.off { --sb:#2a2e2c; --sbd:#9aa29a; color:#d5d8d2; }
.slot.atk { --sb:#7a2216; --sbd:#ffd9cf; }
/* Pulsar: el círculo se ilumina y encoge un poco. Fin de la recarga: un destello corto. */
.slot.on::before, .slot.tap::before { --bga:.85; --sb:#ffcf3a; --sbd:#fff6d0; transform:scale(.9); }
.slot.on, .slot.tap { color:#1c1a12; }
.slot.on b, .slot.tap b { text-shadow:none; }
.slot.ready::before { animation:rdy .5s ease-out; }
@keyframes rdy { 0% { box-shadow:0 0 0 0 rgba(255,236,160,.9); } 100% { box-shadow:0 0 0 12px rgba(255,236,160,0); } }
/* Posiciones (centro de cada botón respecto a la esquina inferior derecha). Revisión del 27-10 noche (Sebastian): el
   ATAQUE pasa a la izquierda, más o menos donde estaba la esquiva (−172, −74), y el resto se ordena en arco a su
   izquierda y por encima. Así queda una FRANJA LIBRE a la derecha (≈ 110 px, desde abajo hasta ⇄) para arrastrar la
   cámara con el pulgar sin ir al centro. Ninguna área táctil pisa a otra ni la franja. */
.s-main  { --sz:78px; --hit:96px; --sb:#7a2216; --sbd:#ffd9cf; left:-172px; top:-74px; }
.s-main b { font-size:31px; } .s-main .l { font-size:9px; }
.s-main.off { --sb:#4a2a25; }
.s-dodge { --sz:54px; left:-262px; top:-104px; }
.s-ab1   { left:-254px; top:-186px; }
.s-ab2   { left:-196px; top:-234px; }
.s-ab3   { left:-150px; top:-160px; }
.s-guard { --sz:44px; --hit:58px; left:-340px; top:-150px; }
.s-ctx   { --sz:44px; --hit:58px; --sb:#1f4a2a; --sbd:#d6f2cf; left:-332px; top:-232px; }
/* «Batalla/Explorar» (alterna el menú a mano): cuadrado pequeño a la izquierda del grupo. */
.s-menu  { --sz:40px; --hit:54px; --sb:#3a3524; --sbd:#efe2b0; left:-352px; top:-74px; border-radius:12px; }
.s-menu::before, .s-menu::after { border-radius:9px; }
/* ⇄ explorador / bestia: APARTE, arriba del grupo, cuadrado redondeado azul con doble borde. */
.s-swap  { --sz:48px; --hit:60px; --sb:#173a63; --sbd:#9fd0ff; left:-36px; top:-258px; border-radius:14px; }
.s-swap::before, .s-swap::after { border-radius:12px; }
.s-swap::before { border-width:2px; box-shadow:0 0 0 2px color-mix(in srgb, #0b1a2c 60%, transparent), 0 0 0 3.5px color-mix(in srgb, #9fd0ff 60%, transparent); }
.s-guard .l, .s-ab3 .l, .s-ctx .l, .s-menu .l, .s-swap .l { font-size:7.5px; max-width:44px; } .s-guard b, .s-ctx b, .s-menu b, .s-swap b { font-size:17px; }
.stage[data-ctx="COMBATE"] .s-ab1:not(.off), .stage[data-ctx="COMBATE"] .s-ab2:not(.off), .stage[data-ctx="COMBATE"] .s-ab3:not(.off) { --sb:#3a2463; --sbd:#e3d6fb; }
.chooser { position:absolute; inset:0; z-index:7; pointer-events:none; }

  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; font-size:9.5px; transform:scale(var(--ui)); }
.chooser button b { font-size:21px; font-weight:400; }
.chooser button small { font-size:8px; color:#ffe28a; min-height:8px; }
.chooser button.off { background:color-mix(in srgb, #2a2e2c calc(var(--bga, .48) * 100% + 15%), transparent); color:#c9ccc6; border-color:#8d918c; }
.chooser .ch-t { position:absolute; transform:translate(-50%, -50%); font:600 11.5px system-ui; color:#f3f1ec; background:#1c2420; padding:2px 10px; border-radius:999px; white-space:nowrap; }
.topr { position:absolute; right:max(14px, env(safe-area-inset-right)); top:max(6px, env(safe-area-inset-top)); z-index:8; display:flex; gap:10px; transform:scale(var(--ui)); transform-origin:top right; }
.topr button { width:54px; height:54px; border-radius:50%; padding:0; font-size:21px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; background:color-mix(in srgb, #1d2621 calc(var(--bga, .48) * 100%), transparent); color:#fff; border:1.5px solid color-mix(in srgb, #e8e4da 70%, transparent); text-shadow:0 1px 2px #000; }

.radial .ring { position:absolute; width:0; height:0; }

.joy { position:absolute; z-index:4; width:calc(130px * var(--ui)); height:calc(130px * var(--ui)); margin:calc(-65px * var(--ui)) 0 0 calc(-65px * var(--ui)); border-radius:50%; border:2px solid rgba(255,255,255,.45); background:rgba(255,255,255,.1); pointer-events:none; left:calc(max(14px, env(safe-area-inset-left)) + 95px); bottom:calc(max(10px, env(safe-area-inset-bottom)) + 30px); }
.joy.idle { opacity:.6; }
